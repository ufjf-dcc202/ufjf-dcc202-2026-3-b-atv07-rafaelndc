<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em Linha</title>
</head>
<body>
    <main>
        <h1>DCC202 CSS Em Linha</h1>
        <p>Você pode aplicar estilo <em style="color: orange;">em linha
        </em> para um elemento usando o atributo <code style="color: lime; text-decoration: underline;">style</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor texto do elemento.</dd>
                <dt><code>backgroud-color</code></dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
</html>
